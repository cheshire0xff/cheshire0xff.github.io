name: CI

on:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mypy --strict
      - run: uv run pylint src tests
      - run: uv run pytest
      - run: uv run sitegen build
