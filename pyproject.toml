[project]
name = "sitegen"
version = "0.1.0"
description = "Static site generator for my personal GitHub Pages site"
authors = [
    { name = "cheshire0xff", email = "cheshire0xff@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mako>=1.4.3",
    "markdown>=3.11.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
sitegen = "sitegen.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "types-markdown>=3.10.2.20261007",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mako.*"]
ignore_missing_imports = true

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-function-docstring", "missing-class-docstring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
